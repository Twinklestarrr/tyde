[project]
name = "shadow-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "browser-use==0.13.11",
    "bubus==1.5.6",
    "cdp-use==1.4.5",
    "fastapi==0.156.4",
    "mss==10.0.0",
    "pillow==12.3.0",
    "pyautogui==0.9.54",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pynput==1.7.7",
    "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6,<7",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".venv/.pytest_cache"
