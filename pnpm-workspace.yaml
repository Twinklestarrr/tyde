packages:
  - apps/*
  - packages/*
allowBuilds:
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  electron-winstaller: false
  esbuild: true
  prisma: true
  protobufjs: false
saveExact: true
engineStrict: true
fetchRetries: 1
fetchTimeout: 30000
verifyDepsBeforeRun: warn
